<svg xmlns="http://www.w3.org/2000/svg" width="96" height="192" viewBox="0 0 96 192">
  <!-- Igapó das Memórias — feixe de luz filtrada. Sobreposição suave. -->
  <defs>
    <linearGradient id="shaft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9f7c4" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#b8e6b0" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#8fc9b4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shaftCore" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2ffd9" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#e0ffcf" stop-opacity="0.12"/>
